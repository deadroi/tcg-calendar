<script>
const decksEl = document.getElementById('decks');
const canvas = document.getElementById('chart');
const ctx = canvas.getContext('2d');
let decks = [];
let chartType = 'pie';

const colors = ['#658fdb','#f7a56d','#9c79d4','#6eb9ab','#e080a4','#d4b56b','#7194a0','#dc7d67','#a3b86a','#7583ba'];
const bgColor = () => document.getElementById('bgColor').value;
const textColor = () => document.getElementById('textColor').value;
function lum(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return (0.299*r+0.587*g+0.114*b)/255; }
const NOTES = {
  pie: '인원 비율에 따라 원형 조각 크기가 정해집니다. 이미지가 있으면 조각 영역에 잘라 넣습니다. 기타 그룹은 아래 범례에 세부 덱을 표시합니다.',
  treemap: '인원 비율에 따라 사각형 크기가 정해집니다. 이미지가 있으면 사각형을 채우도록 잘라 넣습니다. 기타 그룹은 아래 범례에 세부 덱을 표시합니다.',
};

/* ── 덱 입력 행 ── */
function addDeck(name='', count=1, image='', color=''){
  decks.push({id:crypto.randomUUID(), name, count, image,
    color: color || colors[decks.length % colors.length]});
  renderRows(); draw();
}
function renderRows(){
  decksEl.innerHTML = '';
  decks.forEach((d,i)=>{
    const el=document.createElement('div'); el.className='deck';
    const top=document.createElement('div'); top.className='deck-top';
    const name=document.createElement('input'); name.type='text'; name.placeholder='덱 이름'; name.value=d.name;
    name.oninput=()=>{d.name=name.value; draw()};
    const num=document.createElement('input'); num.type='number'; num.min='0'; num.value=d.count;
    num.oninput=()=>{d.count=Number(num.value)||0; draw()};
    const col=document.createElement('input'); col.type='color'; col.title='이미지 없을 때 표시 색상';
    col.value=d.color||colors[i%colors.length];
    col.oninput=()=>{d.color=col.value; draw()};
    const del=document.createElement('button'); del.className='danger'; del.textContent='삭제';
    del.onclick=()=>{decks.splice(i,1); renderRows(); draw()};
    top.append(name,num,col,del);
    const file=document.createElement('input'); file.type='file'; file.accept='image/*'; file.hidden=true;
    file.onchange=()=>{
      const f=file.files && file.files[0]; if(!f) return;
      const reader=new FileReader();
      reader.onload=()=>{d.image=reader.result; d.imgX=d.imgX??50; d.imgY=d.imgY??50; d.imgZoom=d.imgZoom??100; renderRows(); draw()};
      reader.readAsDataURL(f);
    };
    const pick=document.createElement('button'); pick.type='button'; pick.className='secondary';
    pick.style.cssText='margin-top:7px;padding:6px 10px;font-size:13px';
    pick.textContent = d.image ? '이미지 변경' : '이미지 선택';
    pick.onclick=()=>file.click();
    const st=document.createElement('small'); st.style.marginLeft='8px';
    st.textContent = d.image ? '이미지 등록됨' : '선택 사항';
    const picker=document.createElement('div'); picker.append(file,pick,st);
    el.append(top,picker);
    if(d.image){
      const adj=document.createElement('div'); adj.className='img-adj';
      /* el 에는 이미 top,picker 가 들어 있으므로 adj 만 추가 */
      const mk=(label,key,min,max,def)=>{
        const row=document.createElement('label');
        const sl=document.createElement('input'); sl.type='range'; sl.min=min; sl.max=max; sl.value=d[key]??def;
        sl.oninput=()=>{d[key]=Number(sl.value); draw()};
        row.append(label+' ', sl); return row;
      };
      adj.append(mk('좌우','imgX',0,100,50), mk('상하','imgY',0,100,50), mk('크기','imgZoom',30,300,100));
      const reset=document.createElement('button'); reset.type='button'; reset.className='secondary';
      reset.textContent='위치 초기화'; reset.style.cssText='padding:4px 8px;font-size:12px;margin-top:4px';
      reset.onclick=()=>{d.imgX=50; d.imgY=50; d.imgZoom=100; renderRows(); draw()};
      adj.append(reset);
      el.append(adj);
    }
    decksEl.append(el);
  });
}

/* ── 이미지 캐시 ── */
const imageCache=new Map();
function getImage(src){
  if(!src) return null;
  if(!imageCache.has(src)){ const im=new Image(); im.onload=draw; im.src=src; imageCache.set(src,im); }
  const im=imageCache.get(src);
  return im.complete && im.naturalWidth ? im : null;
}
/* 사각형을 꽉 채우도록(cover) 이미지 그리기 — rect로 클립한 뒤 draw.
   opt.posX/posY (0~1, 0.5=중앙)로 어느 부분을 보일지, opt.zoom으로 확대 조절. */
function drawImageCover(im, x, y, w, h, opt={}){
  const posX = opt.posX ?? 0.5, posY = opt.posY ?? 0.5, zoom = opt.zoom ?? 1;
  ctx.save();
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  const scale=Math.max(w/im.width, h/im.height)*zoom;
  const dw=im.width*scale, dh=im.height*scale;
  // 기본 이동폭(=이미지가 칸을 넘치는 양)에 칸 크기만큼 여유를 더해 끝에서 더 밀 수 있게 한다.
  // 중앙(0.5)은 그대로 중앙, 양 끝(0/1)은 칸 밖으로 더 나간다.
  const extraX = w, extraY = h;
  const dx = x + extraX - ((dw-w) + 2*extraX)*posX;   // posX 0=오른쪽 여유, 1=왼쪽 여유
  const dy = y + extraY - ((dh-h) + 2*extraY)*posY;   // posY 0=아래 여유, 1=위 여유
  ctx.drawImage(im, dx, dy, dw, dh);
  ctx.restore();
}
function imgOpt(d){ return {posX:(d.imgX??50)/100, posY:(d.imgY??50)/100, zoom:(d.imgZoom??100)/100}; }
function textOutline(text, x, y, font, fill){
  // 글자색이 밝으면 어두운 테두리, 어두우면 밝은 테두리로 가독성 확보
  const outline = lum(fill) > 0.6 ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.9)';
  ctx.font=font; ctx.lineWidth=4; ctx.strokeStyle=outline; ctx.lineJoin='round';
  ctx.strokeText(text,x,y); ctx.fillStyle=fill; ctx.fillText(text,x,y);
}

/* ── 공통: 헤더 + 묶기 처리 → items/other 반환 ── */
function prepare(){
  const total=decks.reduce((s,d)=>s+Math.max(0,d.count),0);
  const threshold=Number(document.getElementById('threshold').value)||0;
  const merge=document.getElementById('merge').checked;
  const ordinary=decks.filter(d=>d.count>0 && (!merge || d.count>threshold));
  const other=decks.filter(d=>d.count>0 && merge && d.count<=threshold);
  const items=ordinary.map(d=>({name:d.name, count:d.count, image:d.image, color:d.color, imgX:d.imgX, imgY:d.imgY, imgZoom:d.imgZoom}));
  if(other.length) items.push({name:'ETC', count:other.reduce((s,d)=>s+d.count,0), image:'', color:'#b9c0cc', isOther:true});
  items.sort((a,b)=>b.count-a.count);
  return {total, items, other};
}
function header(total){
  const tc=textColor();
  ctx.textAlign='left';
  textOutline(document.getElementById('title').value||'덱 분포표', 38, 55, 'bold 30px sans-serif', tc);
  const dt=document.getElementById('date').value, sub=document.getElementById('subtitle').value;
  ctx.font='22px sans-serif'; ctx.fillStyle=tc;
  ctx.fillText((dt?dt+' · ':'')+(sub||''), 38, 94);
  ctx.fillText('참가 인원: '+total+'명', 38, 129);
}
function legendOther(other, y0){
  if(!other.length) return;
  const tc=textColor();
  ctx.textAlign='left'; ctx.fillStyle=tc; ctx.font='bold 19px sans-serif';
  ctx.fillText('기타 덱 상세', 40, y0);
  ctx.font='17px sans-serif'; ctx.fillStyle=tc;
  other.map(d=>d.name+' '+d.count).forEach((name,i)=>
    ctx.fillText(name, 40+(i%3)*190, y0+32+Math.floor(i/3)*25));
}

/* ── 메인 draw: 타입 분기 ── */
function draw(){
  const W=1200, H=850;
  ctx.clearRect(0,0,W,H); ctx.fillStyle=bgColor(); ctx.fillRect(0,0,W,H);
  const {total, items, other}=prepare();
  header(total);
  if(!total){ ctx.fillStyle=textColor(); ctx.font='26px sans-serif'; ctx.textAlign='center';
    ctx.fillText('덱과 인원수를 입력해 주세요.', W/2, 440); ctx.textAlign='left'; return; }
  if(chartType==='treemap') drawTreemap(items, total);
  else drawPie(items, total);
  if(document.getElementById('showOther').checked) legendOther(other, 690);
}

/* ── 1) 파이 차트 ── */
function drawPie(items, total){
  const cx=720, cy=430, r=300; let angle=-Math.PI/2;
  items.forEach((d,i)=>{
    const span=2*Math.PI*d.count/total, end=angle+span;
    ctx.save();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,end); ctx.closePath(); ctx.clip();
    ctx.fillStyle=d.color||colors[i%colors.length]; ctx.fillRect(cx-r,cy-r,2*r,2*r);
    const im=getImage(d.image);
    if(im) drawImageCover(im, cx-r, cy-r, 2*r, 2*r, imgOpt(d));
    ctx.restore();
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,angle,end); ctx.closePath();
    ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.stroke();
    const mid=angle+span/2, tx=cx+Math.cos(mid)*(r+34), ty=cy+Math.sin(mid)*(r+32);
    ctx.textAlign = tx<cx-30?'right':tx>cx+30?'left':'center';
    textOutline(d.name+' '+d.count, tx, ty, 'bold 20px sans-serif', textColor());
    angle=end;
  });
  ctx.textAlign='left';
}

/* ── 2) 이미지 트리맵 (squarified) ── */
function drawTreemap(items, total){
  const X=40, Y=160, W=1120, H=500;
  layoutSquarify(items.slice(), {x:X,y:Y,w:W,h:H}, total).forEach((cell,i)=>{
    const {x,y,w,h,item}=cell;
    ctx.fillStyle=item.color||colors[i%colors.length]; ctx.fillRect(x,y,w,h);
    const im=getImage(item.image);
    if(im) drawImageCover(im, x, y, w, h, imgOpt(item));
    ctx.lineWidth=3; ctx.strokeStyle='#fff'; ctx.strokeRect(x,y,w,h);
    if(w>46 && h>26){
      ctx.textAlign='left';
      textOutline(item.name, x+9, y+26, 'bold 18px sans-serif', textColor());
      textOutline(String(item.count), x+9, y+48, 'bold 17px sans-serif', textColor());
    }
  });
}
// 간단 squarified 트리맵
function layoutSquarify(items, rect, total){
  const out=[]; let {x,y,w,h}=rect;
  const vals=items.map(it=>({it, area: it.count/total*(w*h)}));
  let row=[], rowStart=0;
  function worst(row, len){
    const s=row.reduce((a,b)=>a+b.area,0); const mx=Math.max(...row.map(r=>r.area)), mn=Math.min(...row.map(r=>r.area));
    return Math.max((len*len*mx)/(s*s), (s*s)/(len*len*mn));
  }
  let rx=x, ry=y, rw=w, rh=h;
  let i=0;
  while(i<vals.length){
    const horizontal = rw>=rh; const len = horizontal?rh:rw;
    const cur=vals[i];
    if(row.length===0){ row.push(cur); i++; continue; }
    if(worst(row,len) >= worst(row.concat(cur),len)){ row.push(cur); i++; }
    else { placeRow(row, horizontal); row=[]; }
  }
  if(row.length) placeRow(row, rw>=rh);
  function placeRow(row, horizontal){
    const s=row.reduce((a,b)=>a+b.area,0);
    if(horizontal){ // 세로로 쌓고 x 전진
      const colW=s/rh; let cy2=ry;
      row.forEach(r=>{ const cellH=r.area/colW; out.push({x:rx,y:cy2,w:colW,h:cellH,item:r.it}); cy2+=cellH; });
      rx+=colW; rw-=colW;
    } else { // 가로로 쌓고 y 전진
      const rowH=s/rw; let cx2=rx;
      row.forEach(r=>{ const cellW=r.area/rowH; out.push({x:cx2,y:ry,w:cellW,h:rowH,item:r.it}); cx2+=cellW; });
      ry+=rowH; rh-=rowH;
    }
  }
  return out;
}

/* ── 저장/불러오기/내보내기 ── */
function download(name,text,type){
  const blob=new Blob([text],{type}), u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
}
document.getElementById('add').onclick=()=>addDeck('',1);
document.getElementById('export').onclick=()=>{ draw(); canvas.toBlob(blob=>{
  if(!blob) return; const u=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=u; a.download='tcg_distribution_'+chartType+'.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }); };
document.getElementById('save').onclick=()=>download('tcg_distribution.json', JSON.stringify({
  title:document.getElementById('title').value, date:document.getElementById('date').value,
  subtitle:document.getElementById('subtitle').value, threshold:document.getElementById('threshold').value,
  merge:document.getElementById('merge').checked, showOther:document.getElementById('showOther').checked, bgColor:bgColor(), textColor:textColor(), chartType, decks
},null,2), 'application/json');
document.getElementById('loadBtn').onclick=()=>document.getElementById('loadFile').click();
document.getElementById('loadFile').onchange=async e=>{
  try{
    const data=JSON.parse(await e.target.files[0].text());
    for(const k of ['title','date','subtitle','threshold']) document.getElementById(k).value=data[k]??'';
    document.getElementById('merge').checked=!!data.merge;
    document.getElementById('showOther').checked=data.showOther!==false;
    if(data.bgColor) document.getElementById('bgColor').value=data.bgColor;
    if(data.textColor) document.getElementById('textColor').value=data.textColor;
    if(data.chartType) setType(data.chartType);
    decks=(data.decks||[]).map((d,i)=>({id:crypto.randomUUID(), name:String(d.name||''), count:Number(d.count)||0, image:d.image||'', color:d.color||colors[i%colors.length], imgX:d.imgX??50, imgY:d.imgY??50, imgZoom:d.imgZoom??100}));
    renderRows(); draw();
  }catch(err){ alert('JSON 파일을 읽을 수 없습니다: '+err.message); }
  e.target.value='';
};
['title','date','subtitle','threshold','merge','showOther','bgColor','textColor'].forEach(id=>
  document.getElementById(id).addEventListener('input',draw));

/* ── 차트 타입 선택 ── */
function setType(t){
  chartType=t;
  document.querySelectorAll('#chartTypes button').forEach(b=>b.classList.toggle('on', b.dataset.type===t));
  document.getElementById('chartNote').textContent=NOTES[t];
  draw();
}
document.getElementById('chartTypes').onclick=e=>{ const b=e.target.closest('button'); if(b) setType(b.dataset.type); };
document.getElementById('resetColor').onclick=()=>{ document.getElementById('bgColor').value='#ffffff'; document.getElementById('textColor').value='#1f2b46'; draw(); };

/* ── 날짜 기본값: 오늘 (로컬 기준) ── */
(() => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset());
  document.getElementById('date').value=d.toISOString().slice(0,10); })();

/* ── 데모 데이터 ── */
[['덱 A',4],['덱 B',3],['덱 C',3],['덱 D',2],['덱 E',2],['덱 F',1],['덱 G',1]]
  .forEach(([n,c],i)=>decks.push({id:crypto.randomUUID(), name:n, count:c, image:'', color:colors[i%colors.length]}));
setType('pie'); renderRows(); draw();
</script>
